org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

kotlin.code.style=official

# Default API endpoint - override in local.properties
AEGIS_API_BASE_URL=https://api.aegis.local/v1/
AEGIS_WS_BASE_URL=wss://api.aegis.local/ws/

# Disable KSP incremental processing to prevent file storage conflicts
ksp.incremental=false